name: build

# 打 tag（如 v0.2）或手动触发时，编译服务端、Windows 客户端与 Android APK 并上传产物。
# Windows 产物不内置服务器地址（构建时不传 -X main.builtinServer），符合"仓库不含私人地址"的约定。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  server:
    name: 服务端 linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - name: Build
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o ../dist/syncwatch-server-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: syncwatch-server-linux-${{ matrix.arch }}
          path: dist/syncwatch-server-linux-${{ matrix.arch }}

  windows:
    name: Windows 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: windows/go.sum
      - name: Build
        working-directory: windows
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w" -o ../dist/syncwatch-win.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: syncwatch-windows
          path: dist/syncwatch-win.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 不再用 android-actions/setup-android：它调用的 sdkmanager 与当前 runner 镜像
      # 不兼容（Failed to find package 'tools'），而 ubuntu-latest 本来就预装了 Android SDK。
      - name: 使用 runner 预装的 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "使用 SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
      - name: 补齐 SDK 34 组件（已存在则跳过）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            echo "SDK 组件就绪"
          fi
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: syncwatch-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
